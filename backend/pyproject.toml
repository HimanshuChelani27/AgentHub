[project]
name = "agenthub-backend"
version = "0.1.0"
description = "AgentHub: open-source MCP gateway & agent registry with RBAC, PII masking, audit and tracing"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "bcrypt>=5.0.0",
    "en-core-web-sm",
    "fastapi[standard]>=0.143.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.14",
    "mcp>=2.3.0",
    "openai>=3.28.0",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqlmodel>=0.0.48",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# FastAPI's Depends()/Header() defaults are the intended pattern
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
